# Caption style presets for ffmpeg/libass subtitles.
# 사용자가 미세 조정하기 쉬운 파일입니다. /render style=<preset> 로 선택합니다.
# 색상은 ASS/SSA 형식(&HAABBGGRR)입니다. 예: &H00FFFFFF=흰색, &H0000D7FF=노란색 계열.
presets:
  default:
    FontName: Noto Sans CJK KR
    FontSize: 110
    PrimaryColour: "&H00FFFFFF"
    OutlineColour: "&H00000000"
    BackColour: "&H80000000"
    BorderStyle: 3
    Outline: 5
    Shadow: 0
    Alignment: 2
    MarginV: 60
    WrapStyle: 1

  center-outline:
    extends: default
    BorderStyle: 1
    Outline: 6
    Shadow: 2
    Alignment: 5
    MarginV: 0
    PositionMode: center-offset
    Anchor: 5
    OffsetX: 0
    OffsetY: 0

  center-yellow:
    extends: center-outline
    FontSize: 100
    PrimaryColour: "&H0000D7FF"
    Outline: 8
    Shadow: 2

  center-white:
    extends: center-outline
    FontSize: 100
    PrimaryColour: "&H00FFFFFF"
    Outline: 6
    Shadow: 2

  frame-bottom-caption:
    extends: center-outline
    PositionMode: zone
    Zone: frame_bottom
    XPct: 50
    VAlign: bottom
    DistancePct: 15

  
