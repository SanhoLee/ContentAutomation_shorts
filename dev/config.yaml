# Shorts Automation Pipeline - 공통 + 환경별 설정
common:
  PROJECT_ROOT: "/home/ubuntu/brain50"

dev:
  BASE_DIR: "${PROJECT_ROOT}/dev"
  SRC_DIR: "${BASE_DIR}/src"
  ASSETS_DIR: "${BASE_DIR}/data/assets"
  WORK_DIR_BASE: "${BASE_DIR}/data/work"
  OUTPUT_DIR: "${BASE_DIR}/data/output"
  BACKUP_DIR: "${BASE_DIR}/data/backups"
  CLAUDE_MODEL: "claude-sonnet-4-6"
  CLAUDE_STRATEGY_MODEL: "claude-haiku-4-5-20251001"
  CLAUDE_STRATEGY_FALLBACK_MODELS: "claude-sonnet-4-5-20250929"
  CLAUDE_STRATEGY_MAX_TOKENS: 2000
  CLAUDE_PLANNER_MODEL: "claude-haiku-4-5-20251001"
  CLAUDE_CRITIC_MODEL: "claude-haiku-4-5-20251001"
  CLAUDE_AUDIT_MODEL: "claude-haiku-4-5-20251001"
  CLAUDE_PLANNER_MAX_TOKENS: 1200
  CLAUDE_CRITIC_MAX_TOKENS: 900
  CLAUDE_AUDIT_MAX_TOKENS: 1600
  CLAUDE_JOB_BUDGET_USD: 0.30
  CLAUDE_DAILY_BUDGET_USD: 1.00
  CLAUDE_BUDGET_TIMEZONE: "Asia/Tokyo"
  CLAUDE_MAX_WEB_SEARCHES_PER_JOB: 4
  CLAUDE_COST_MODE: "balanced"
  RESEARCH_MODE: "adaptive"
  WEB_RESEARCH_MAX_USES: 2
  CASE_RESEARCH_MAX_USES: 2
  YOUTUBE_FEEDBACK_STRICTNESS: "balanced"
  YOUTUBE_FEEDBACK_AUTO_SYNC: true
  YOUTUBE_FEEDBACK_SYNC_TTL_HOURS: 6

  MAX_TOKENS: 4000
  CLAUDE_HTTP_RETRIES: 1
  PUBMED_RETMAX: 3
  PUBMED_ABSTRACT_CHAR_LIMIT: 7000
  LOG_LEVEL: "DEBUG"
  ATEMPO: 1.05
  TARGET_DURATION_SEC: 80
  CHARS_PER_SEC: 4.5
  CAPTION_FONT_SIZE: 72
  CAPTION_MARGIN_V: 60
  CAPTION_STYLE: "center-yellow"
  FRAME_MODE: "framed"
  FRAME_TOP_STYLE_FILE: "${BASE_DIR}/frame_top_styles.yaml"
  FRAME_BOTTOM_STYLE_FILE: "${BASE_DIR}/frame_bottom_styles.yaml"
  FRAME_TOP_PRESET: "default"
  FRAME_BOTTOM_PRESET: "default"
  BROLL_FIT_MODE: "cover"

prod:
  BASE_DIR: "${PROJECT_ROOT}/prod"
  SRC_DIR: "${BASE_DIR}/src"
  ASSETS_DIR: "${BASE_DIR}/data/assets"
  WORK_DIR_BASE: "${BASE_DIR}/data/work"
  OUTPUT_DIR: "${BASE_DIR}/data/output"
  BACKUP_DIR: "${BASE_DIR}/data/backups"
  CLAUDE_MODEL: "claude-sonnet-4-6"
  CLAUDE_BUDGET_TIMEZONE: "Asia/Tokyo"
  MAX_TOKENS: 2600
  CLAUDE_HTTP_RETRIES: 1
  PUBMED_RETMAX: 3
  PUBMED_ABSTRACT_CHAR_LIMIT: 7000
  LOG_LEVEL: "INFO"
  ATEMPO: 1.05
  TARGET_DURATION_SEC: 80
  CHARS_PER_SEC: 4.66
  CAPTION_FONT_SIZE: 72
  CAPTION_MARGIN_V: 60
  CAPTION_STYLE: "center-yellow"
  FRAME_MODE: "framed"
  FRAME_TOP_STYLE_FILE: "${BASE_DIR}/frame_top_styles.yaml"
  FRAME_BOTTOM_STYLE_FILE: "${BASE_DIR}/frame_bottom_styles.yaml"
  FRAME_TOP_PRESET: "default"
  FRAME_BOTTOM_PRESET: "default"
  BROLL_FIT_MODE: "cover"
