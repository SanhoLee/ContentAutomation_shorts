# Top safe-zone frame presets. height_pct is based on the full 1080x1920 canvas height.
presets:
  default:
    height_pct: 30
    background: black
    title: ""
    subtitle: ""
    font: Noto Sans CJK KR
    font_style: Bold
    title_color: orange
    title_size: 150
    subtitle_color: white
    subtitle_size: 130
    # 주제목 위 여백. 값을 키우면 헤더 높이는 그대로이고 제목만 아래로 내려갑니다.
    top_margin_pct: 30
    bottom_margin_pct: 5
    side_margin_pct: 4

  brain50:
    extends: default
    title: "브레인피프티"
    subtitle: "오늘의 뇌건강"
    title_color: white
